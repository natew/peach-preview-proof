name: Peach
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
jobs:
  contrast:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: sootbean/soot-preview-action@v1
        env:
          CONTRAST_AGENT_BUDGET_SECONDS: 180
        with:
          package-manager: npm
          install: npm install --no-audit --no-fund
          start: npx expo start --port 8081
